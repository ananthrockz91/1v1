<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">

  <meta name="description" content="1v1 — Competitive real-time turn-based multiplayer gaming platform built with Serverpod and Flutter.">
  <meta name="theme-color" content="#0B101E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="1v1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png"/>

  <title>1v1 — Play. Compete. Win.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0B101E;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    // Lightweight Web Audio API Synthesizer for tactile game feel (zero external asset dependencies)
    (function() {
      let ctx = null;
      function getAudioContext() {
        if (!ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) ctx = new AudioContext();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      }

      window.oneVOneAudio = {
        playMove: function() {
          try {
            const ac = getAudioContext();
            if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(320, ac.currentTime + 0.07);
            gain.gain.setValueAtTime(0.18, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.07);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + 0.08);
          } catch(e) {}
        },
        playCapture: function() {
          try {
            const ac = getAudioContext();
            if (!ac) return;
            const now = ac.currentTime;
            [587.33, 880.00].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.22, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.22);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.25);
            });
          } catch(e) {}
        },
        playVictory: function() {
          try {
            const ac = getAudioContext();
            if (!ac) return;
            const now = ac.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.1);
              gain.gain.setValueAtTime(0.25, now + i * 0.1);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.45);
            });
          } catch(e) {}
        },
        playDefeat: function() {
          try {
            const ac = getAudioContext();
            if (!ac) return;
            const now = ac.currentTime;
            [440.00, 349.23, 293.66].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.14);
              gain.gain.setValueAtTime(0.2, now + i * 0.14);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.14 + 0.35);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(now + i * 0.14);
              osc.stop(now + i * 0.14 + 0.38);
            });
          } catch(e) {}
        },
        playTick: function() {
          try {
            const ac = getAudioContext();
            if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, ac.currentTime);
            gain.gain.setValueAtTime(0.08, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + 0.05);
          } catch(e) {}
        }
      };
    })();
  </script>
  <!--

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
