services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: one_v_one
      POSTGRES_PASSWORD: "cvid8rgRs81khevMkc5XA4qNADmnrrID"
    volumes:
      - one_v_one_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "UV8Twxqavn7nIkO6TVpKFGyzPy4rd0HO"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: one_v_one_test
      POSTGRES_PASSWORD: "UM8IChRFdl__hvA4OCf6E_gVmIwtciqT"
    volumes:
      - one_v_one_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "mxxw3RROn7IkMmYD0JEDuiBsa1AmxJPx"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  one_v_one_data:
  one_v_one_test_data:
