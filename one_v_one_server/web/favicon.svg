<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Cyberpunk Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#1E293B" stroke-width="3" />
  
  <!-- Subtle Neon Ring Accent -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- 1v1 Logo Elements -->
  <!-- Left Player 1 (Gold/Amber) -->
  <g filter="url(#shadow)">
    <text x="34" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#glowGold)" text-anchor="middle">1</text>
  </g>

  <!-- VS Emblem (Lightning / Stylized v) -->
  <text x="64" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#94A3B8" text-anchor="middle">v</text>

  <!-- Right Player 2 (Cyan) -->
  <g filter="url(#shadow)">
    <text x="94" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#glowCyan)" text-anchor="middle">1</text>
  </g>

  <!-- Dynamic Duel Underline Accents -->
  <path d="M26 98 L50 98" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="98" r="3" fill="#38BDF8" />
  <path d="M78 98 L102 98" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
</svg>
